name: Deploy Maya to GitHub Pages

# A single Pages site serves both "versions" of Maya, built from two branches:
#   /      → main branch (production)
#   /dev/  → dev branch (work-in-progress preview)
# Both are staged from `git archive` so the artifact never depends on which
# branch triggered the run.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage production (/)
        run: |
          mkdir -p _site
          git archive --format=tar origin/main frontend | tar -x -C _site --strip-components=1

      - name: Stage dev (/dev)
        run: |
          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            mkdir -p _site/dev
            git archive --format=tar origin/dev frontend | tar -x -C _site/dev --strip-components=1
            ls _site/dev | head -10
          else
            echo "no dev branch — omitting /dev"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only main may publish the artifact — the github-pages environment
    # restricts deployments to the main branch. dev pushes re-run the build
    # (archiving both branches), but never attempt the deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4