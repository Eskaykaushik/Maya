<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Maya</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles/maya.css" />
</head>
<body>
  <canvas id="maya-canvas" aria-hidden="true"></canvas>

  <div id="maya-stage" aria-live="polite"></div>

  <div id="maya-prompt" class="maya-prompt">
    <p class="maya-prompt-text">Hi, I am Maya</p>
    <p class="maya-prompt-hint">tap the dark to begin</p>
  </div>

  <div id="maya-transcript" class="maya-transcript"></div>

  <div id="maya-whisper" class="maya-whisper" hidden>
    <span class="maya-whisper-dot"></span>
    <span class="maya-whisper-text">…</span>
  </div>

  <div id="maya-chat" class="maya-chat">
    <span class="chat-spine" aria-hidden="true"></span>
    <button class="chat-collapse" type="button" aria-label="Chat summary" aria-expanded="false" hidden></button>
  </div>

  <div id="maya-summary" class="maya-summary" hidden>
    <p class="maya-summary-title">conversation</p>
    <ul class="maya-summary-lines"></ul>
    <p class="maya-summary-empty" hidden>No conversation yet.</p>
  </div>

  <input id="maya-input" class="maya-input" type="text" autocomplete="off" spellcheck="false"
         placeholder="ask for anything…" aria-label="Type a request" />

  <div id="maya-file" class="maya-file" hidden></div>

  <div id="maya-line" class="maya-line" hidden></div>

  <div id="maya-chooser" class="maya-chooser" hidden>
    <svg class="chooser-arc" viewBox="0 0 260 340" aria-hidden="true">
      <path d="M 130 46 L 130 294"
            fill="none" stroke="rgba(150,165,255,0.32)" stroke-width="1"
            stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="chooser-core" aria-hidden="true"></span>
    <button class="chooser-btn chooser-type" type="button" aria-label="Type a request">
      <span class="chooser-glyph">Aa</span>
      <span class="chooser-label">type</span>
    </button>
    <button class="chooser-btn chooser-speak" type="button" aria-label="Speak a request">
      <span class="chooser-glyph"><span class="speak-dot"></span></span>
      <span class="chooser-label">speak</span>
    </button>
  </div>

  <div id="maya-voice" class="maya-voice" hidden>
    <button class="voice-btn" type="button" aria-label="Talk to Maya">
      <span class="voice-ring voice-ring-1"></span>
      <span class="voice-ring voice-ring-2"></span>
      <span class="voice-ring voice-ring-3"></span>
      <span class="voice-core"></span>
    </button>
    <p class="voice-hint">listening…</p>
  </div>

  <footer class="site-footer">
    <p>Maya — everything you need, when you need it.</p>
    <p class="footer-links">
      Built by
      <a href="https://kaushixlabs.eskaykaushik14.workers.dev/" target="_blank" rel="noopener">Kaushix Labs</a>
      &middot;
      <a href="https://eskaykaushik.github.io/myProfile/" target="_blank" rel="noopener">Shubham Kaushik</a>
    </p>
  </footer>

  <script src="src/config.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
